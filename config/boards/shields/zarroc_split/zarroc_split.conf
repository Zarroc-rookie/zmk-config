# 量大小用的基线：先把「90 余键 + 分体 + RGB」里最花地皮的两项逐个打开，
# 每加一项编一次，差值是这一项的代价。
#
# 第一步（本文件现状）：只有键位，不分体、不 RGB —— 这是基线。
# 第二步：取消下面这行，编一次，差值就是分体协议的代价。
#CONFIG_ZMK_SPLIT=y
#CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
#
# 第三步：再加上下面三行、并在 overlay 里接一个 is31fl3731 节点，
# 差值就是轴下 LED 的代价（这一步要等我按 IS31FL3731 写节点）。
#CONFIG_ZMK_RGB_UNDERGLOW=y
#CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
