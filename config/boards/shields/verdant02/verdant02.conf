# Verdant02 basic Kconfig options (ZMK 4.x safe minimal set).
# All unknown or deprecated symbols removed to keep the build green.
# Anything not explicitly set here inherits from ZMK/app prj.conf defaults.

CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_BT_ID_MAX=5

# Debounce tuned for SMD 1N4148 diodes + hotswap sockets.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=12

# INFO level logging + USB CDC ACM log backend for field debugging.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_ZMK_USB_LOGGING=y
CONFIG_USB_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
