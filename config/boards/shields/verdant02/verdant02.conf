# ---- Verdant02 / nice_nano_v2 / ZMK v0.3.0 ----
# USB + BLE dual-mode, no battery.

# 1) Output channels: USB and BLE enabled independently.
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# 2) BLE advertised device name (also sets USB product name).
#    REQUIRED: without this, BT_DEVICE_NAME is empty string and most
#    hosts (Windows/macOS/iOS) won't show the keyboard in scan results.
#    Max 16 chars.
CONFIG_ZMK_KEYBOARD_NAME="Verdant02"

# 3) BLE profiles (ZMK default is 5; kept explicit here).
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# 4) ZMK Studio (web-based keymap editor via USB CDC-ACM)
CONFIG_ZMK_STUDIO=y
