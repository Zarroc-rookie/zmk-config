# ========================================================================
#  Verdant02 Kconfig defaults
#  (Loaded automatically when shield verdant02 is selected)
# ========================================================================

# --- Outputs: USB cable + BLE wireless ---
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Remember up to 5 BLE hosts
CONFIG_BT_ID_MAX=5

# --- Power / Sleep ---
# nice!nano / SuperMini can reach ~90uA in deep sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000       # 15 minutes idle -> deep sleep

# --- Debounce (tune if you see chatter or keys feel laggy) ---
# Mechanical Cherry-style switches work well at 7-12ms.
# If switches are brand new / feel scratchy, bump to 15ms.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=12

# Required for MO(layer), LT, MT etc. keycodes
CONFIG_ZMK_HOLD_TAP=y

# --- Logging ---
# 3 = INFO, 4 = DEBUG. INFO is safe for production and still shows
# connection events / key press log over USB serial if things go wrong.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_ZMK_USB_LOGGING=y

# Bootloader entry via &bootloader keycode (FN1 layer, last position of row 2)
# Uses Adafruit UF2 bootloader that is already on your SuperMini.
